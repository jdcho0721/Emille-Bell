<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에밀레: 천년의 울림 - 철학적 여정</title>
    <style>
        :root { --gold: #d4af37; --sky: #a8dadc; --lotus: #ffb7c5; --bg: #0a0a0c; }
        body { background-color: var(--bg); color: white; font-family: 'Pretendard', sans-serif; margin: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .story-header { padding: 20px; text-align: center; z-index: 10; max-width: 700px; }
        .story-text { font-size: 1.1rem; line-height: 1.6; color: #ccc; min-height: 4em; transition: all 0.5s; margin-bottom: 10px; }
        .highlight { color: var(--gold); font-weight: bold; }
        .highlight-sky { color: var(--sky); font-weight: bold; }
        .highlight-lotus { color: var(--lotus); font-weight: bold; }

        .interaction-area {
            position: relative; width: 90vw; max-width: 600px;
            border-radius: 15px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .full-bell-img { width: 100%; height: auto; display: block; transition: all 0.5s; filter: grayscale(0.5); }
        .full-bell-img.active { filter: grayscale(0) brightness(1.1); }
        
/* 자막 스타일 추가 */
        #subtitle-overlay {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.5;
            z-index: 1000;
            display: none; /* 기본적으로 숨김 */
            border: 1px solid var(--gold);
            pointer-events: none; /* 클릭 방해 금지 */
            word-break: keep-all;
        }
/* 팝업 내부의 자막은 팝업 레이어보다 위에 있도록 설정 */
        #image-overlay #subtitle-overlay {
            bottom: 50px;
            z-index: 300;
        }
        .touch-zone { 
    position: absolute; 
    border-radius: 50%; 
    z-index: 10; 
    cursor: pointer; 
    /* 점선 테두리를 조금 더 밝게 변경 */
    border: 2px dashed rgba(212, 175, 55, 0.5); 
    transition: all 0.3s; 
}
       .touch-zone:hover { 
    background: rgba(212, 175, 55, 0.2); 
    border-style: solid;
}

        .yongnyu-zone { top: 12%; left: 50%; width: 18%; height: 12%; margin-left: -9%; margin-top: -6%; } 
        .dangjwa-zone { 
    top: 65%; /* 종의 몸체 중앙 하단 연꽃 문양 위치 */
    left: 50%; 
    width: 18%; 
    height: 18%; 
    margin-left: -9%; 
    margin-top: -9%; 
}
        .bicheon-zone { top: 60%; width: 12%; height: 20%; margin-top: -10%; }
        .bicheon-left { left: 30%; margin-left: -6%; }
        .bicheon-right { left: 70%; margin-left: -6%; }
        .yeonroe-zone { top: 34%; width: 10%; height: 10%; margin-top: -5%; }
        .yeonroe-left { left: 32%; margin-left: -5%; }
        .yeonroe-right { left: 68%; margin-left: -5%; }

        #image-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200; display: none; 
            flex-direction: column; justify-content: center; align-items: center;
        }
        .popup-content { max-width: 80%; text-align: center; }
.popup-img { 
    max-width: 100%; 
    max-height: 50vh; /* 화면 높이의 50%까지만 허용 */
    object-fit: contain; /* 이미지 비율 유지 */
    border: 2px solid white; 
    border-radius: 10px; 
    margin-bottom: 20px; 
}

     /*   .popup-img { max-width: 100%; border: 2px solid white; border-radius: 10px; margin-bottom: 20px; }
        .popup-desc { color: #eee; line-height: 1.8; font-size: 1.1rem; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; } */

        .progress-bar { display: flex; gap: 10px; margin: 20px 0; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #333; transition: 0.5s; }
        .dot.active { box-shadow: 0 0 10px currentColor; }

        .info-section { max-width: 700px; width: 90vw; padding: 40px 0; border-top: 1px solid rgba(212, 175, 55, 0.2); margin-top: 20px; }
        .info-title { color: var(--gold); font-size: 1.5rem; margin-bottom: 15px; border-left: 4px solid var(--gold); padding-left: 15px; cursor: help; }
        .info-content { color: #ccc; line-height: 1.8; margin-bottom: 30px; font-size: 1rem; cursor: help; }

        /* 사용방법 리스트 스타일 */
        .guide-list { margin: 15px 0; padding-left: 20px; color: #bbb; font-size: 1rem; line-height: 1.8; list-style-type: square; }

        #video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 100; display: none; justify-content: center; align-items: center;
        }
        #video-overlay video { width: 100%; height: 100%; object-fit: contain; }
        .close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 40px; cursor: pointer; z-index: 201; }

        .ripple { position: absolute; border-radius: 50%; transform: scale(0); animation: ripple-animation 2s forwards; pointer-events: none; }
        @keyframes ripple-animation { to { transform: scale(4); opacity: 0; } }
    </style>
</head>
<body>

<div id="subtitle-overlay"></div>

    <div class="story-header">
        <h1>에밀레: <span class="highlight">천년의 철학</span></h1>
        <p class="story-text" id="description-text">
            성덕대왕신종의 성물들을 터치하여<br>신라인들이 꿈꾼 <span class="highlight">조화로운 우주</span>를 완성하세요.
        </p>
    </div>

 <div class="interaction-area">
    <img src="종 전체.png" alt="성덕대왕신종" class="full-bell-img" id="bell-img">
    
    <div class="touch-zone dangjwa-zone" onclick="showPopup('dangjwa', event)"></div>
    
    <div class="touch-zone yongnyu-zone" onclick="showPopup('yongnyu', event)"></div>
    <div class="touch-zone bicheon-zone bicheon-left" onclick="showPopup('bicheon', event)"></div>
    <div class="touch-zone bicheon-zone bicheon-right" onclick="showPopup('bicheon', event)"></div>
    <div class="touch-zone yeonroe-zone yeonroe-left" onclick="showPopup('yeonroe', event)"></div>
    <div class="touch-zone yeonroe-zone yeonroe-right" onclick="showPopup('yeonroe', event)"></div>
    
    <div id="ripple-container"></div>
</div>

    <div class="progress-bar">
        <div id="dot-dangjwa" class="dot"></div>
        <div id="dot-bicheon" class="dot"></div>
        <div id="dot-yeonroe" class="dot"></div>
        <div id="dot-yongnyu" class="dot"></div>
    </div>

<div class="info-section">
    <h2 class="info-title" onmouseenter="speakInfo('work')">작품 설명: 에밀레 - 천년의 철학</h2>
    <div class="info-content" onmouseenter="speakInfo('work')">
        <p style="margin:0;"></p>
    </div>

    <h2 class="info-title" onmouseenter="speakInfo('guide')">사용 방법 안내</h2>
    <div class="info-content" onmouseenter="speakInfo('guide')">
        <p style="margin:0;"></p>
    </div>

    <h2 class="info-title" onmouseenter="speakInfo('author')">작가 소개: 조준동 (趙浚東)</h2>
    <div class="info-content" onmouseenter="speakInfo('author')">
        
    </div>
</div>

 <div id="image-overlay">
    <span class="close-btn" onclick="closePopup()">&times;</span>
    <div class="popup-content">
        <img id="popup-img" class="popup-img" src="" alt="성물 상세 이미지">
        <h2 id="popup-title" style="color: var(--gold); margin-bottom: 5px;"></h2>
        
        <div id="popup-desc" style="display: none;"></div>
        
        <p style="color: #888; margin-top: 20px; font-size: 0.9rem; letter-spacing: 0.5px;">
            이미지를 터치하여 천년의 해설을 자막으로 확인하세요.
        </p>
    </div>
</div>

    <div id="video-overlay">
        <span class="close-btn" onclick="closeVideo()">&times;</span>
        <div id="video-player-container"></div>
    </div>

    <audio id="audio-dangjwa" src="bell_sound.mp3"></audio>
    <audio id="audio-bicheon" src="bicheon_sound.mp3"></audio>
    <audio id="audio-yeonroe" src="yeonroe_sound.mp3"></audio>
    <audio id="audio-yongnyu" src="bell_sound.mp3"></audio>

    <script>
        const state = { dangjwa: false, bicheon: false, yeonroe: false, yongnyu: false };
        const descText = document.getElementById('description-text');
        const bellImg = document.getElementById('bell-img');

        const subtitleEl = document.getElementById('subtitle-overlay');
        let subtitleTimer = null;


 function speakInfo(section) {
        let text = "";
        if(section === 'work') {
            text = "작품 설명입니다. 성덕대왕신종은 771년 완성된 신라 예술의 결정체입니다. 아이의 목소리가 깃들었다는 에밀레 신화는 중생 구제를 위한 숭고한 희생과 간절한 염원을 상징합니다. 본 전시는 이 천년의 소리를 현대적 기술로 재구성하여 시각 너머의 깊은 사유를 전달합니다.";
        } else if(section === 'guide') {
            text = "사용 방법입니다. 종 위의 성물들을 클릭하여 해설을 감상하세요. 이미지를 한 번 더 클릭하여 짧은 요약 해설을, 다시 클릭하여 깊이 있는 상세 해설을 들을 수 있습니다. 4개의 영역이 모두 활성화되면 천지인의 조화가 이루어지며 최종 영상을 감상하실 수 있습니다.";
        } else if(section === 'author') {
            text = "작가 소개입니다. 조준동 교수는 성균관대학교 명예교수이자 휴마톨로지 철학을 바탕으로 기술의 사회적 책임과 장애인 접근성 향상을 연구하는 학자이자 작가입니다.";
        }
        speak(text); // 이 함수가 호출되면서 화면 중앙 하단에 자막이 표시됩니다.
    }

function speak(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    
    // 사용 가능한 모든 목소리 목록 가져오기
    const voices = window.speechSynthesis.getVoices();
    
    // 가장 성우 목소리에 가까운 고품질 음성(Natural 또는 Google) 찾기
    const preferredVoice = voices.find(voice => 
        (voice.lang === 'ko-KR' || voice.lang === 'ko_KR') && 
        (voice.name.includes('Google') || voice.name.includes('Natural'))
    );

    if (preferredVoice) {
        utterance.voice = preferredVoice;
    }

    utterance.lang = 'ko-KR';
    utterance.rate = 0.9;  // 속도를 0.9로 약간 늦추면 훨씬 정중하고 성우 같은 느낌이 납니다.
    utterance.pitch = 1.0; // 음조를 조절하여 신뢰감 있는 목소리 톤 설정
    
    showSubtitle(text);
    window.speechSynthesis.speak(utterance);
}

        /**
         * 자막을 화면에 띄우는 함수
         */
        function showSubtitle(text) {
            if (subtitleTimer) clearTimeout(subtitleTimer);
            
            subtitleEl.innerText = text;
            subtitleEl.style.display = 'block';
            
            // 시각적 피드백을 위해 살짝 깜빡이는 효과 (선택)
            subtitleEl.style.opacity = 0;
            setTimeout(() => { subtitleEl.style.opacity = 1; }, 50);
        }


// 상태 변수: 팝업 내 클릭 횟수 추적
let popupClickCount = 0;
let popupClickTimer = null;

let currentActiveType = null; // 현재 활성화된 성물 타입 저장

function showPopup(type, event) {
    if (event) event.preventDefault();
// 1. 이벤트 버블링 방지 (상위 body의 클릭 이벤트 실행 막기)
    if (event) {
        event.preventDefault();
        event.stopPropagation(); // 이 코드가 추가되어야 합니다.
    }

    currentActiveType = type;
    popupClickCount = 0; // 클릭 횟수 초기화

    const data = popupData[type];
    const overlay = document.getElementById('image-overlay');
    
    // 엘리먼트 참조
    const img = document.getElementById('popup-img');
    const title = document.getElementById('popup-title');
    const desc = document.getElementById('popup-desc');

    // 데이터 삽입
    img.src = data.img;
    title.innerText = data.title;
    desc.innerText = data.desc;
    
    // 팝업 표시
    overlay.style.display = 'flex';

    // 1. 진입 시 기능 설명(desc) 재생
    window.speechSynthesis.cancel();
    speak(data.desc);

    // 2. 기존 playElement 로직 통합 (상태 업데이트 및 메인 화면 점등)
    const audio = document.getElementById(`audio-${type}`);
    if(audio) { audio.currentTime = 0; audio.play(); }
    state[type] = true;
    const dot = document.getElementById(`dot-${type}`);
    if(dot) dot.classList.add('active');
    
    createRipple(event, data.color);
    checkComplete();
}

document.getElementById('image-overlay').onclick = function(e) {
    if (e.target.classList.contains('close-btn') || !currentActiveType) return;

    const data = popupData[currentActiveType];

    // 클릭 카운트 증가
    popupClickCount++;
    window.speechSynthesis.cancel();

    if (popupClickCount === 1) {
        // 첫 번째 클릭: 요약 해설
        speak(data.adShort);
    } else {
       // 추가 클릭: 상세 해설 (자막 바에 표시됨)
        speak(data.adLong);
        window.speechSynthesis.speak(utterance);
        // 필요 시 여기서 카운트를 0으로 초기화하여 반복 청취 가능하게 설정 가능
    }
};



// 1. 상세화된 데이터 객체 (요약/상세 버전 반영)
const popupData = {
    dangjwa: { 
        img: '당좌.png', 
        title: '당좌(撞座): 호국과 통합', 
        desc: '당좌입니다. 국가의 안녕을 지키고 백성의 마음을 하나로 모으는 염원을 담고 있습니다.', 
        adShort: '화면 해설입니다. 종의 아랫부분, 종을 치는 지점인 에밀레종의 당좌는 연꽃무늬로 화려하게 장식되어 있습니다. 종의 소리를 가장 잘 내기 위한 과학적인 위치에 자리 잡고 있습니다. 여덟 잎의 연꽃이 기하학적인 대칭을 이루며 활짝 피어 있습니다. 마치 금방이라도 회전하며 성스러운 울림을 만들어낼 듯한 생동감이 느껴집니다.',
        adLong: '화면 해설 상세 버전입니다. 가장 두터운 울림이 시작되는 당좌는 단순히 종을 치는 자리를 넘어, 국가의 안녕을 지키고 백성의 마음을 하나로 모으는 통합의 염원을 상징합니다. 중앙의 볼록한 원형 지점은 힘의 응축을 보여주며, 이를 감싸는 여덟 잎의 연꽃은 완벽한 균형미를 선사합니다. 연꽃잎 사이사이의 미세한 곡선들은 시각적 안정감을 주며, 이곳을 터치하면 낮고 웅장한 범종의 맥놀이 소리가 여러분의 심장을 울릴 것입니다.',
        color: '#d4af37' 
    },
    yeonroe: { 
        img: '연뢰.png', 
        title: '연뢰(蓮蕾): 생명의 봉우리', 
        desc: '연뢰입니다. 만물의 탄생과 다산, 끊이지 않는 생명력과 풍요를 상징합니다.', 
        adShort: '화면 해설입니다. 종의 윗부분, 화려한 보상화 문양으로 둘러싸인 사각형 공간 안에 연뢰가 배치되어 있습니다. 마치 갓 피어오르려는 아기 연꽃 봉우리 아홉 개가 3행 3열의 정갈한 배열로 봉긋하게 솟아 있습니다. 봉우리의 끝은 매끄러운 곡선을 그리며 생명력을 머금고 있어, 만물의 탄생과 풍요로운 우주의 질서를 시각적으로 보여줍니다.',
        adLong: '화면 해설 상세 버전입니다. 천상의 정원을 연상시키는 연뢰 영역을 탐색합니다. 사각형의 테두리 안에서 아홉 개의 연꽃 봉우리가 질서 정연하게 솟아오른 모습은 신라인들이 꿈꾼 조화로운 세계관을 상징합니다. 각 봉우리는 부드러운 곡선으로 마감되어 중생의 번뇌가 씻겨나간 자리에 맺힌 깨달음의 열매처럼 보입니다. 이 아홉 개의 봉우리는 수직과 수평의 완벽한 수열을 이루며 사용자에게 공간적 정위감을 제공합니다. 연뢰를 하나하나 터치할 때마다 마치 맑은 이슬이 떨어지는 듯한 청아한 타악기 선율이 이어지며, 이는 곧 종 전체가 내뱉을 거대한 울림을 준비하는 생명의 전주곡이 됩니다.',
        color: '#ffb7c5' 
    },
    bicheon: { 
        img: '비천상-좌.png', // 제공된 이미지 파일명으로 업데이트
        title: '비천상(飛天像): 해탈의 선율',

function startInitialGuide() {

// 1. 모든 상태를 초기화하는 함수
function resetExperience() {
    // 상태 변수 초기화
    state.dangjwa = false;
    state.bicheon = false;
    state.yeonroe = false;
    state.yongnyu = false;

    // UI 초기화: 점등된 도트 해제
    document.querySelectorAll('.dot').forEach(dot => dot.classList.remove('active'));

    // UI 초기화: 종 이미지 활성화 해제
    bellImg.classList.remove('active');

    // UI 초기화: 안내 텍스트 복구
    playAccessibilityGuide();

    console.log("체험이 초기화되었습니다.");
}

// 2. 비디오 종료 및 닫기 시 초기화 로직 (수정된 closeVideo)
function closeVideo() {
    document.getElementById('video-overlay').style.display = 'none';
    document.getElementById('video-player-container').innerHTML = '';
    
    // 영상 시청 후 초기 상태로 복구
    resetExperience();
}

// 3. 비디오 재생 설정 (수정된 showVideo)
function showVideo() {
    window.speechSynthesis.cancel();
    document.getElementById('video-overlay').style.display = 'flex';
    
    // 영상 태그 생성 및 종료 이벤트 리스너 추가
    const container = document.getElementById('video-player-container');
    container.innerHTML = `
        <video id="main-video" controls autoplay onended="closeVideo()">
            <source src="Wind_Over_the_Peak.mp4" type="video/mp4">
        </video>`;
}

// 4. 완료 체크 로직 수정 (필요 시 안내 멘트 후 리셋 연동)
function checkComplete() {
    if (state.dangjwa && state.bicheon && state.yeonroe && state.yongnyu) {
        bellImg.classList.add('active');
        setTimeout(() => {
            speak("천지인의 조화가 이루어졌습니다. 신라의 풍경을 감상해보세요.");
            // 사용자가 취소를 눌러도 다시 할 수 있도록 flow 유지
            if(confirm("모든 성물을 찾았습니다. 영상을 보시겠습니까?")) {
                showVideo();
            } else {
                resetExperience(); // 보지 않겠다고 하면 초기화
            }
        }, 2000);
    }
}

// 팝업 닫을 때 자막도 즉시 숨김
        function closePopup() { 
            document.getElementById('image-overlay').style.display = 'none'; 
            subtitleEl.style.display = 'none';
            window.speechSynthesis.cancel();
        }


        

        function playElement(type, event) {
            const audio = document.getElementById(`audio-${type}`);
            if(audio) { audio.currentTime = 0; audio.play(); }
            state[type] = true;
            const dot = document.getElementById(`dot-${type}`);
            if(dot) dot.classList.add('active');
            
            let color = '#ffffff';
            let plainText = "";
            if (type === 'dangjwa') { color = '#d4af37'; plainText = "호국과 통합. 국가의 안녕을 지키는 염원입니다."; }
            else if (type === 'bicheon') { color = '#a8dadc'; plainText = "해탈과 구제. 자비로운 부처님의 목소리입니다."; }
            else if (type === 'yeonroe') { color = '#ffb7c5'; plainText = "생명과 풍요. 만물의 탄생을 상징합니다."; }
            else if (type === 'yongnyu') { color = '#d4af37'; plainText = "권위와 울림. 왕의 권위와 지혜의 상징입니다."; }

            descText.innerHTML = `<span style="color:${color}">[${plainText.split('.')[0]}]</span> ${plainText.split('.')[1]}`;
            speak(plainText);
            createRipple(event, color);
            checkComplete();
        }

 

        function createRipple(event, color) {
            const rect = event.target.getBoundingClientRect();
            const parentRect = document.querySelector('.interaction-area').getBoundingClientRect();
            const top = ((rect.top + rect.height/2 - parentRect.top) / parentRect.height * 100) + '%';
            const left = ((rect.left + rect.width/2 - parentRect.left) / parentRect.width * 100) + '%';
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.top = top; ripple.style.left = left;
            ripple.style.width = '120px'; ripple.style.height = '120px';
            ripple.style.marginLeft = '-60px'; ripple.style.marginTop = '-60px';
            ripple.style.border = `3px solid ${color}`;
            document.getElementById('ripple-container').appendChild(ripple);
            setTimeout(() => ripple.remove(), 2000);
        }
